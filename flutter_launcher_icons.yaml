# Launcher icons generated from the Stitch "Siyag Word Explorer" logo
# (gold puzzle piece on charcoal — Amber Noir identity).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_1024.png"
  # Android adaptive icon: charcoal background + padded gold puzzle foreground.
  adaptive_icon_background: "#181309"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  background_color_ios: "#181309"
