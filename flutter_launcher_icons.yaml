# Launcher icons — Siyaq graphite/gold brand (metallic "S" mark).
# Sources: design_reference/SIYAQ_Flutter_Brand_Resources → assets/branding/.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  # Adaptive icon: warm graphite background + padded metallic-S foreground.
  adaptive_icon_background: "#EDEAE4"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  # Android 13+ themed (monochrome) icon: white silhouette.
  adaptive_icon_monochrome: "assets/branding/notification_icon.png"
  background_color_ios: "#F4F2EE"
