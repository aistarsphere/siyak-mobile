name: context_game
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  google_sign_in: ^7.0.0
  # Firebase foundation (Core + Cloud Messaging only — no Firebase Auth).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.2.0
  sign_in_with_apple: ^8.1.0
  # Short-SFX playback (AudioPool / low-latency). Exact-pinned per house rule.
  audioplayers: 6.8.1
  lucide_icons_flutter: 3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # Bundled fonts (no runtime fetching — works fully offline):
  # Sora for Latin (Stitch spec) + Noto Sans Arabic for Arabic script.
  fonts:
    # Script-aware stack. Arabic and Latin get faces designed for their own
    # script; a single family for both is what produced tofu in the Figma spec.
    #
    #   Arabic content : IBM Plex Sans Arabic -> Noto Naskh Arabic -> system
    #   Latin  content : Inter                -> system
    #   Numerals/codes : DM Mono
    #
    # IBM Plex Sans Arabic - OFL 1.1, github.com/IBM/plex (via google/fonts)
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/siyag/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/siyag/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/siyag/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/siyag/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Inter - OFL 1.1, github.com/rsms/inter (via google/fonts). Variable `wght`
    # axis: one asset covers 400-700, driven by SiyaqTypography's fontVariations.
    - family: Inter
      fonts:
        - asset: assets/fonts/siyag/Inter.ttf
    # Arabic fallback only - two weights are enough for a face that renders just
    # the glyphs IBM Plex Sans Arabic happens to miss.
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/siyag/NotoNaskhArabic-400.ttf
          weight: 400
        - asset: assets/fonts/siyag/NotoNaskhArabic-700.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/siyag/DMMono-400.ttf
          weight: 400
        - asset: assets/fonts/siyag/DMMono-500.ttf
          weight: 500

    # ── Organic design system (Claude Design adoption) ──────────────────────
    # All four are SIL OFL 1.1; the licence texts ship beside the faces in
    # assets/fonts/organic/. Variable files are used where they exist so one
    # asset covers a weight range instead of several static cuts.
    #
    #   Latin  display : Caprasimo (single weight by design)
    #   Latin  body    : Figtree            — variable wght 300..900
    #   Arabic display : Baloo Bhaijaan 2   — variable wght 400..800
    #   Arabic body    : Tajawal            — static 400/500/700 (no variable cut)
    #
    # Weight is driven through TextStyle.fontVariations for the two variable
    # families; fontWeight alone does not move a variable axis.
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/organic/Caprasimo-Regular.ttf
          weight: 400
    - family: Figtree
      fonts:
        - asset: assets/fonts/organic/Figtree-Variable.ttf
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/organic/BalooBhaijaan2-Variable.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/organic/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/organic/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/organic/Tajawal-Bold.ttf
          weight: 700
